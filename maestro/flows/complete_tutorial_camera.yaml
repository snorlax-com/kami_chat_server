appId: com.auraface.kami_face_oracle
---
# E2E カメラルート以外（フォールバック）: 真顔撮影の説明 → カメラ → 診断結果
- runFlow:
    when:
      visible: "E2E: 撮影シミュレーション中"
    commands:
      - extendedWaitUntil:
          visible: "性格診断結果"
          timeout: 180000
- extendedWaitUntil:
    visible: "椅子に座り"
    timeout: 30000
    optional: true
- runFlow:
    when:
      visible: "椅子に座り"
    commands:
      - tapOn: "次へ"
- runFlow:
    when:
      visible: "髪を上げておでこを見せてください"
    commands:
      - tapOn: "次へ"
- runFlow:
    when:
      visible: "カメラを開始"
    commands:
      - tapOn: "カメラを開始"
      - runFlow: dismiss_startup_dialogs.yaml
      - extendedWaitUntil:
          visible: "撮影"
          timeout: 120000
      - tapOn:
          text: "手動で撮影"
          optional: true
      - tapOn: "撮影"
      - extendedWaitUntil:
          visible: "性格診断結果"
          timeout: 240000
